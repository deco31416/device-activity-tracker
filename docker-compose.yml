services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PORT=${BACKEND_PORT:-4000}
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    environment:
      - PORT=${BACKEND_PORT:-4000}
      - SIGNAL_API_URL=${SIGNAL_API_URL:-http://localhost:8080}
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      # Persist WhatsApp auth state
      - baileys_auth:/app/auth_info_baileys
    networks:
      - app-network
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - PORT=${CLIENT_PORT:-4001}
        - REACT_APP_API_URL=${BACKEND_URL:-http://localhost:4000}
    ports:
      - "${CLIENT_PORT:-4001}:${CLIENT_PORT:-4001}"
    environment:
      - PORT=${CLIENT_PORT:-4001}
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  signal-api:
    image: bbernhard/signal-cli-rest-api:0.80
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MODE=json-rpc
    restart: unless-stopped
    networks:
      - app-network

volumes:
  baileys_auth:
    driver: local

networks:
  app-network:
    driver: bridge
